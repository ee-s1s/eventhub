<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تذكرتك المعتمدة للفعالية</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f5;">
    <div style="max-width: 500px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        <h2 style="color: #06b6d4;">مرحباً بك في الفعالية</h2>
        <p>عزيزي الحاضر، تم تسجيل بياناتك بنجاح.</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <p><strong>كود التذكرة الخاص بك هو:</strong></p>
        <div style="font-size: 24px; font-weight: bold; color: #10b981; background: #f0fdf4; padding: 10px; display: inline-block; border-radius: 6px; letter-spacing: 1px;">
            {{ attendee.ticket_code }}
        </div>
        <p style="font-size: 12px; color: #666; margin-top: 20px;">يرجى إبراز هذا الكود أو رمز الـ QR المرفق عند البوابة لتسهيل عملية الدخول.</p>
    </div>
</body>
</html>
